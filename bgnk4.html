<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bgnk4</title>
<style>
  :root {
    --bg: #141414;
    --surface: #1c1c1c;
    --surface2: #242424;
    --border: #333;
    --text: #e0e0e0;
    --muted: #888;
    --accent: #e02020;
    --accent2: #b81818;
    --logo: #e02020;
    --danger: #c03030;
    --link: #aaa;
    --radius: 6px;
    --font-size: 14px;
    --font: Georgia, "Times New Roman", serif;
  }
  [data-theme="classic"] {
    --bg: #e8e8e8;
    --surface: #f5f5f5;
    --surface2: #ececec;
    --border: #bbb;
    --text: #1a1a1a;
    --muted: #666;
    --accent: #cc0000;
    --accent2: #aa0000;
    --logo: #cc0000;
    --link: #555;
  }
  [data-theme="light"] {
    --bg: #fafafa;
    --surface: #fff;
    --surface2: #f0f0f0;
    --border: #ccc;
    --text: #111;
    --muted: #777;
    --accent: #e02020;
    --accent2: #c01818;
    --logo: #e02020;
    --link: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    font-size: var(--font-size);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.55;
  }
  .hidden { display: none !important; }
  .screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    width: 100%;
    max-width: 400px;
  }
  .card h1, .logo {
    font-size: 1.75rem;
    letter-spacing: 1px;
    margin-bottom: 4px;
    color: var(--logo);
    font-weight: bold;
  }
  .start-title {
    text-align: center;
    font-size: 4.5rem;
    letter-spacing: 4px;
    color: var(--logo);
    font-weight: bold;
    margin-bottom: 0;
  }
  .card-start {
    text-align: center;
    background: transparent;
    border: none;
    padding: 0;
    max-width: none;
  }
  .card-start .start-fields { margin-top: 36px; max-width: 280px; margin-left: auto; margin-right: auto; }
  .card-start input { text-align: center; }
  .home-hero {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 120px);
  }
  .home-hero .start-title { font-size: 5rem; }
  .card .sub { color: var(--muted); font-size: .85rem; margin-bottom: 20px; }
  label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 14px;
    font: inherit;
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    border-color: transparent;
  }
  button, .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 10px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover, .btn:hover { opacity: .88; }
  button.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.danger { background: var(--danger); color: #fff; }
  .error { color: var(--danger); font-size: .85rem; margin-top: -8px; margin-bottom: 10px; }
  .hint { color: var(--muted); font-size: .75rem; margin-top: -8px; margin-bottom: 12px; }

  #app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 6px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header .logo {
    font-size: 1.15rem;
    cursor: pointer;
  }
  header .user { color: var(--muted); font-size: .8rem; margin-left: auto; }
  header .user span { color: var(--text); font-weight: 600; }
  nav.boards {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    padding: 4px 10px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
  }
  nav.boards button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 3px 10px;
    font-size: 1.12rem;
    font-weight: normal;
    border-radius: 4px;
  }
  nav.boards button.active {
    background: var(--surface);
    color: var(--logo);
    border-color: var(--logo);
  }
  main { flex: 1; padding: 16px; max-width: 900px; width: 100%; margin: 0 auto; }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar h2 { font-size: 1.1rem; flex: 1; }
  .home-title {
    text-align: center;
    font-size: 2.2rem;
    letter-spacing: 3px;
    color: var(--logo);
    font-weight: bold;
    margin-bottom: 20px;
  }
  .home-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .home-link {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 14px;
    cursor: pointer;
    font-size: .9rem;
    transition: border-color .15s, background .15s;
  }
  .home-link:hover { border-color: var(--logo); background: var(--surface2); }
  .home-link.chat-link { border-color: var(--border); }
  .thread {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .thread:hover { border-color: var(--logo); }
  .thread .meta { font-size: .75rem; color: var(--muted); margin-bottom: 6px; }
  .thread .meta .id { color: var(--link); }
  .thread .preview { font-size: .95rem; }
  .thread .stats { font-size: .75rem; color: var(--muted); margin-top: 8px; }

  .post {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 10px;
  }
  .post.op { border-left: 3px solid var(--logo); }
  .post .head {
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .post .head .name { color: var(--text); font-weight: 700; }
  .post .head .trip { color: var(--muted); }
  .post .body { white-space: pre-wrap; word-break: break-word; }
  .post .body .quotetext { color: var(--muted); font-style: italic; }
  .post img {
    max-width: 100%;
    max-height: 400px;
    border-radius: 6px;
    margin-top: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .reply-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 16px;
  }
  .reply-form textarea { min-height: 80px; resize: vertical; }
  .file-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .file-row input[type=file] { font-size: .8rem; }

  .chat-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    height: calc(100vh - 180px);
    min-height: 300px;
    display: flex;
    flex-direction: column;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chat-msg {
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 10px 12px;
    max-width: 85%;
    align-self: flex-start;
  }
  .chat-msg.mine { align-self: flex-end; background: rgba(224,32,32,.1); border: 1px solid var(--logo); }
  .chat-msg .who { font-size: .75rem; color: var(--text); font-weight: 700; margin-bottom: 4px; }
  .chat-msg .when { font-size: .7rem; color: var(--muted); margin-left: 8px; font-weight: 400; }
  .chat-msg img { max-width: 240px; max-height: 200px; border-radius: 6px; margin-top: 6px; cursor: pointer; }
  .chat-input {
    border-top: 1px solid var(--border);
    padding: 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .chat-input textarea { flex: 1; min-width: 200px; min-height: 44px; margin: 0; resize: none; }
  .chat-input button { flex-shrink: 0; }

  .settings-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 16px;
  }
  .modal-overlay img { max-width: 95vw; max-height: 90vh; border-radius: 8px; }

  .back-link {
    color: var(--link);
    cursor: pointer;
    font-size: .85rem;
    margin-bottom: 12px;
    display: inline-block;
  }
  .back-link:hover { text-decoration: underline; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  footer {
    text-align: center;
    padding: 12px;
    font-size: .7rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  .hidden-board {
    position: fixed;
    bottom: 10px;
    left: 10px;
    font-size: .65rem;
    color: var(--muted);
    opacity: 0.3;
    background: none;
    border: none;
    padding: 2px 6px;
    cursor: pointer;
    z-index: 5;
    font-weight: normal;
  }
  .hidden-board:hover { opacity: 0.65; color: var(--logo); }
  .hidden-board.active { opacity: 0.85; color: var(--logo); }
</style>
</head>
<body>

<div id="screen-key" class="screen">
  <div class="card card-start">
    <div class="start-title">bgnk4</div>
    <div class="start-fields">
      <input type="password" id="key-input" placeholder="····" autocomplete="off">
      <p id="key-error" class="error hidden"></p>
      <button id="key-btn" style="width:100%">Weiter</button>
    </div>
  </div>
</div>

<div id="screen-name" class="screen hidden">
  <div class="card card-start">
    <div class="start-title">bgnk4</div>
    <div class="start-fields">
      <input type="text" id="name-input" placeholder="Name" maxlength="32">
      <button id="name-btn" style="width:100%">Weiter</button>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo" id="go-home">bgnk4</div>
    <button class="secondary" id="btn-settings" style="padding:4px 8px;font-size:.75rem">Einstellungen</button>
    <button class="secondary danger" id="btn-lock" style="padding:4px 8px;font-size:.75rem">Sperren</button>
    <div class="user">Du bist <span id="display-name">?</span></div>
  </header>
  <nav class="boards" id="board-nav"></nav>
  <main id="main-content"></main>
  <button id="hidden-board" class="hidden-board" title="">?</button>
  <footer>invite only · verschlüsselt · bgnk4</footer>
</div>

<div id="img-modal" class="modal-overlay hidden" onclick="this.classList.add('hidden')">
  <img id="modal-img" src="" alt="">
</div>

<script>
const SITE_KEY = '0000';
const serverMode = location.protocol === 'http:' || location.protocol === 'https:';
let inviteCode = sessionStorage.getItem('bgnk4_invite') || '';
let syncTimer = null;

const NAV_BOARDS = [
  { id: 'allgemein', name: 'Allgemein' },
  { id: 'tests',     name: 'Tests' },
  { id: 'memes',     name: 'Memes' },
];
const HIDDEN_BOARD = { id: 'random', name: '?' };

function getBoard(id) {
  return NAV_BOARDS.find(b => b.id === id) || (HIDDEN_BOARD.id === id ? HIDDEN_BOARD : null);
}

let cryptoKey = null;
let session = { name: 'Anonym', trip: '' };
let settings = { theme: 'default', fontSize: 14 };
let view = { mode: 'home', board: null, thread: null };
let isAdmin = false;

async function deriveKey(passphrase) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('bgnk4-salt-v1'), iterations: 100000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
  );
}

async function encrypt(data) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(JSON.stringify(data)));
  const combined = new Uint8Array(iv.length + ct.byteLength);
  combined.set(iv); combined.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function decrypt(b64) {
  try {
    const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = raw.slice(0, 12);
    const ct = raw.slice(12);
    const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, ct);
    return JSON.parse(new TextDecoder().decode(dec));
  } catch { return null; }
}

async function loadStore() {
  let vaultB64 = null;
  if (serverMode && inviteCode) {
    try {
      const res = await fetch('/api/vault', { headers: { 'X-Invite': inviteCode } });
      if (res.ok) {
        const j = await res.json();
        vaultB64 = j.vault;
      }
    } catch {}
  }
  if (!vaultB64) vaultB64 = localStorage.getItem('bgnk4_vault_cache');
  if (!vaultB64) return { threads: {}, chat: [], settings: null, updatedAt: 0 };
  const data = await decrypt(vaultB64);
  if (data) localStorage.setItem('bgnk4_vault_cache', vaultB64);
  return data || { threads: {}, chat: [], settings: null, updatedAt: 0 };
}

async function saveStore(data) {
  data.updatedAt = Date.now();
  const vaultB64 = await encrypt(data);
  localStorage.setItem('bgnk4_vault_cache', vaultB64);
  if (serverMode && inviteCode) {
    await fetch('/api/vault', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Invite': inviteCode },
      body: JSON.stringify({ vault: vaultB64 })
    });
  }
}

function loadProfile() {
  try { return JSON.parse(localStorage.getItem('bgnk4_profile')); } catch { return null; }
}
function saveProfile(p) {
  localStorage.setItem('bgnk4_profile', JSON.stringify(p));
}

async function validateInvite(code) {
  if (!serverMode) return code === SITE_KEY;
  try {
    const res = await fetch('/api/invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code })
    });
    if (!res.ok) return false;
    const j = await res.json();
    if (j.ok) {
      inviteCode = code;
      isAdmin = code.trim() === '2011';
      sessionStorage.setItem('bgnk4_invite', code);
      return true;
    }
  } catch {}
  return false;
}

async function pullRemote() {
  if (!serverMode || !inviteCode || !cryptoKey) return;
  try {
    const res = await fetch('/api/vault', { headers: { 'X-Invite': inviteCode } });
    if (!res.ok) return;
    const { vault } = await res.json();
    if (!vault) return;
    const remote = await decrypt(vault);
    if (!remote) return;
    if ((remote.updatedAt || 0) > (store?.updatedAt || 0)) {
      store = remote;
      localStorage.setItem('bgnk4_vault_cache', vault);
      if (!document.getElementById('app').classList.contains('hidden')) render();
    }
  } catch {}
}

function startSync() {
  stopSync();
  if (serverMode && inviteCode) syncTimer = setInterval(pullRemote, 4000);
}
function stopSync() {
  if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
}

let store = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function formatTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('de-AT') + ' ' + d.toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
}
function parseName(input) {
  const m = (input || '').trim().match(/^(.+?)#(.+)$/);
  if (m) {
    const trip = simpleTrip(m[2]);
    return { name: m[1], trip: '!' + trip.slice(0, 8) };
  }
  return { name: (input || '').trim() || 'Anonym', trip: '' };
}
function simpleTrip(secret) {
  let h = 0;
  for (let i = 0; i < secret.length; i++) h = ((h << 5) - h + secret.charCodeAt(i)) | 0;
  return Math.abs(h).toString(16).padStart(8, '0');
}
function renderBody(text) {
  return esc(text).split('\n').map(line => {
    if (line.startsWith('>')) return `<span class="quotetext">${esc(line)}</span>`;
    return esc(line);
  }).join('<br>');
}
function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function showImage(src) {
  document.getElementById('modal-img').src = src;
  document.getElementById('img-modal').classList.remove('hidden');
}
function applySettings() {
  document.documentElement.dataset.theme = settings.theme === 'default' ? '' : settings.theme;
  document.documentElement.style.setProperty('--font-size', settings.fontSize + 'px');
}

function showScreen(id) {
  document.getElementById('screen-key').classList.toggle('hidden', id !== 'screen-key');
  document.getElementById('screen-name').classList.toggle('hidden', id !== 'screen-name');
  document.getElementById('app').classList.toggle('hidden', id !== 'app');
}

async function unlock() {
  cryptoKey = await deriveKey(SITE_KEY);
  store = await loadStore();
  if (store.settings) { settings = { ...settings, ...store.settings }; applySettings(); }
  const profile = loadProfile();
  if (profile) {
    session = profile;
    showScreen('app');
    buildNav();
    render();
    startSync();
  } else {
    showScreen('screen-name');
  }
}

async function setProfile(nameInput) {
  session = parseName(nameInput);
  saveProfile(session);
  document.getElementById('display-name').textContent = session.name + session.trip;
  showScreen('app');
  buildNav();
  render();
  startSync();
}

function lock() {
  stopSync();
  cryptoKey = null;
  store = null;
  isAdmin = false;
  sessionStorage.removeItem('bgnk4_invite');
  inviteCode = '';
  document.getElementById('key-input').value = '';
  showScreen('screen-key');
}

function buildNav() {
  const nav = document.getElementById('board-nav');
  nav.innerHTML = '';

  const homeBtn = document.createElement('button');
  homeBtn.textContent = 'Start';
  homeBtn.className = view.mode === 'home' ? 'active' : '';
  homeBtn.onclick = () => { view = { mode: 'home', board: null, thread: null }; render(); };
  nav.appendChild(homeBtn);

  const chatBtn = document.createElement('button');
  chatBtn.textContent = 'Chat';
  chatBtn.className = view.mode === 'chat' ? 'active' : '';
  chatBtn.onclick = () => { view = { mode: 'chat', board: null, thread: null }; render(); };
  nav.appendChild(chatBtn);

  NAV_BOARDS.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.name;
    btn.className = (view.mode === 'board' && view.board === b.id && !view.thread) ? 'active' : '';
    btn.onclick = () => { view = { mode: 'board', board: b.id, thread: null }; render(); };
    nav.appendChild(btn);
  });

  const hiddenBtn = document.getElementById('hidden-board');
  if (hiddenBtn) {
    const onHidden = view.mode === 'board' && view.board === HIDDEN_BOARD.id;
    hiddenBtn.classList.toggle('active', onHidden);
    hiddenBtn.onclick = () => { view = { mode: 'board', board: HIDDEN_BOARD.id, thread: null }; render(); };
  }
}

function render() {
  buildNav();
  const main = document.getElementById('main-content');
  if (view.mode === 'home') main.innerHTML = renderHome();
  else if (view.mode === 'chat') main.innerHTML = renderChat();
  else if (view.mode === 'board' && !view.thread) main.innerHTML = renderBoard();
  else if (view.mode === 'board' && view.thread) main.innerHTML = renderThread();
  else if (view.mode === 'settings') main.innerHTML = renderSettings();
  attachEvents();
}

function renderHome() {
  return `<div class="home-hero"><div class="start-title">bgnk4</div></div>`;
}

function countThreads(boardId) {
  return Object.values(store.threads || {}).filter(t => t.board === boardId).length;
}

function renderBoard() {
  const board = getBoard(view.board);
  const threads = Object.values(store.threads || {})
    .filter(t => t.board === view.board)
    .sort((a, b) => b.created - a.created);

  return `
    <div class="toolbar">
      <h2>${esc(board.name)}</h2>
      <button id="new-thread-btn">+ Neuer Thread</button>
      ${isAdmin ? '<button class="danger" id="delete-all-threads">Alles löschen</button>' : ''}
    </div>
    ${threads.length ? threads.map(t => `
      <div class="thread" data-thread="${t.id}">
        <div class="meta"><span class="id">Nr.${t.id.slice(-6)}</span> · ${formatTime(t.created)} · <span class="name">${esc(t.author)}</span>${isAdmin ? ` <button class="danger" data-delete-thread="${t.id}" style="padding:2px 6px;font-size:.7rem;margin-left:auto">Löschen</button>` : ''}</div>
        <div class="preview">${esc(t.body.slice(0, 120))}${t.body.length > 120 ? '...' : ''}</div>
        <div class="stats">${(t.replies||[]).length} Antworten ${t.image ? ' · Bild' : ''}</div>
      </div>
    `).join('') : '<div class="empty">Noch nix hier. Mach den ersten Thread!</div>'}
    <div id="new-thread-form" class="reply-form hidden">
      <h3 style="margin-bottom:12px">Neuer Thread</h3>
      <textarea id="nt-body" placeholder="Was geht? (> für Zitat)"></textarea>
      <div class="file-row"><input type="file" id="nt-image" accept="image/*"></div>
      <button id="nt-submit">Posten</button>
      <button class="secondary" id="nt-cancel" style="margin-left:8px">Abbrechen</button>
    </div>`;
}

function renderThread() {
  const t = store.threads[view.thread];
  if (!t) { view.thread = null; return renderBoard(); }
  const board = getBoard(t.board);

  let html = `<span class="back-link" id="back-board">← ${esc(board.name)}</span>`;
  html += renderPost(t, true);
  (t.replies || []).forEach(r => { html += renderPost(r, false); });
  html += `
    <div class="reply-form">
      <h3 style="margin-bottom:12px">Antworten</h3>
      <textarea id="reply-body" placeholder="Antwort... (> Zitat)"></textarea>
      <div class="file-row"><input type="file" id="reply-image" accept="image/*"></div>
      <button id="reply-submit">Antworten</button>
    </div>`;
  return html;
}

function renderPost(p, isOp) {
  return `
    <div class="post ${isOp ? 'op' : ''}">
      <div class="head">
        <span class="name">${esc(p.author)}</span>${p.trip ? `<span class="trip">${esc(p.trip)}</span>` : ''}
        <span>Nr.${p.id.slice(-6)}</span>
        <span>${formatTime(p.created)}</span>
        ${isAdmin && !isOp ? `<button class="danger" data-delete-reply="${p.id}" style="padding:2px 6px;font-size:.7rem;margin-left:auto">Löschen</button>` : ''}
      </div>
      <div class="body">${renderBody(p.body)}</div>
      ${p.image ? `<img src="${p.image}" alt="attachment" class="zoom-img">` : ''}
    </div>`;
}

function renderChat() {
  const msgs = (store.chat || []).slice(-100);
  return `
    <h2 style="margin-bottom:12px">Chat ${isAdmin ? '<button class="danger" id="clear-chat" style="padding:4px 8px;font-size:.75rem;margin-left:8px">Chat leeren</button>' : ''}</h2>
    <div class="chat-box">
      <div class="chat-messages" id="chat-msgs">
        ${msgs.length ? msgs.map(m => `
          <div class="chat-msg ${m.author === session.name ? 'mine' : ''}">
            <div class="who">${esc(m.author)}${m.trip ? esc(m.trip) : ''}<span class="when">${formatTime(m.created)}</span>${isAdmin ? `<button class="danger" data-delete-chat="${m.id}" style="padding:2px 6px;font-size:.7rem;margin-left:auto">Löschen</button>` : ''}</div>
            ${m.body ? `<div>${renderBody(m.body)}</div>` : ''}
            ${m.image ? `<img src="${m.image}" class="zoom-img" alt="">` : ''}
          </div>
        `).join('') : '<div class="empty">Noch leer. Schreib was!</div>'}
      </div>
      <div class="chat-input">
        <textarea id="chat-text" placeholder="Nachricht schreiben..."></textarea>
        <input type="file" id="chat-image" accept="image/*" style="width:auto;margin:0">
        <button id="chat-send">Senden</button>
      </div>
    </div>`;
}

function renderSettings() {
  return `
    <span class="back-link" id="back-home">← Zurück</span>
    <h2 style="margin-bottom:16px">Einstellungen</h2>
    <div class="settings-grid">
      <div>
        <label>Design</label>
        <select id="set-theme">
          <option value="default" ${settings.theme==='default'?'selected':''}>Dunkel</option>
          <option value="classic" ${settings.theme==='classic'?'selected':''}>Grau (hell)</option>
          <option value="light" ${settings.theme==='light'?'selected':''}>Weiß</option>
        </select>
      </div>
      <div>
        <label>Schriftgröße</label>
        <input type="range" id="set-font" min="13" max="18" value="${settings.fontSize}">
      </div>
      <div>
        <label>Anzeigename</label>
        <input type="text" id="set-name" value="${esc(session.name + (session.trip ? '#' : ''))}" placeholder="Name#geheim">
      </div>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="set-save">Speichern</button>
      <button class="danger" id="set-clear">Alles löschen</button>
    </div>`;
}

function attachEvents() {
  document.querySelectorAll('[data-thread]').forEach(el => {
    el.onclick = () => { view.thread = el.dataset.thread; render(); };
  });
  document.getElementById('back-board')?.addEventListener('click', () => { view.thread = null; render(); });
  document.getElementById('back-home')?.addEventListener('click', () => { view = { mode: 'home', board: null, thread: null }; render(); });

  document.getElementById('new-thread-btn')?.addEventListener('click', () => {
    document.getElementById('new-thread-form').classList.remove('hidden');
  });
  document.getElementById('nt-cancel')?.addEventListener('click', () => {
    document.getElementById('new-thread-form').classList.add('hidden');
  });
  document.getElementById('nt-submit')?.addEventListener('click', () => createThread());
  document.getElementById('reply-submit')?.addEventListener('click', () => addReply());
  document.getElementById('chat-send')?.addEventListener('click', () => sendChat());
  document.getElementById('chat-text')?.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
  document.querySelectorAll('.zoom-img').forEach(img => {
    img.onclick = e => { e.stopPropagation(); showImage(img.src); };
  });

  // Admin delete events
  document.getElementById('delete-all-threads')?.addEventListener('click', async () => {
    if (confirm('Wirklich ALLES löschen?')) {
      try {
        const res = await fetch('/api/vault', { method: 'DELETE', headers: { 'X-Invite': inviteCode } });
        if (res.ok) {
          store = { threads: {}, chat: [], settings: null, updatedAt: 0 };
          await saveStore(store);
          render();
        }
      } catch {}
    }
  });
  document.querySelectorAll('[data-delete-thread]').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const threadId = btn.dataset.deleteThread;
      if (confirm('Thread löschen?')) {
        delete store.threads[threadId];
        await saveStore(store);
        render();
      }
    };
  });
  document.querySelectorAll('[data-delete-reply]').forEach(btn => {
    btn.onclick = async () => {
      const replyId = btn.dataset.deleteReply;
      if (confirm('Antwort löschen?')) {
        const t = store.threads[view.thread];
        t.replies = t.replies.filter(r => r.id !== replyId);
        await saveStore(store);
        render();
      }
    };
  });
  document.getElementById('clear-chat')?.addEventListener('click', async () => {
    if (confirm('Chat leeren?')) {
      store.chat = [];
      await saveStore(store);
      render();
    }
  });
  document.querySelectorAll('[data-delete-chat]').forEach(btn => {
    btn.onclick = async () => {
      const msgId = btn.dataset.deleteChat;
      store.chat = store.chat.filter(m => m.id !== msgId);
      await saveStore(store);
      render();
    };
  });

  const cm = document.getElementById('chat-msgs');
  if (cm) cm.scrollTop = cm.scrollHeight;
}

async function createThread() {
  const body = document.getElementById('nt-body').value.trim();
  if (!body) return;
  let image = null;
  const file = document.getElementById('nt-image').files[0];
  if (file) image = await readFileAsDataURL(file);
  const id = uid();
  store.threads[id] = {
    id, board: view.board, body, image,
    author: session.name, trip: session.trip,
    created: Date.now(), replies: []
  };
  await saveStore(store);
  view.thread = id;
  render();
}

async function addReply() {
  const body = document.getElementById('reply-body').value.trim();
  if (!body) return;
  let image = null;
  const file = document.getElementById('reply-image').files[0];
  if (file) image = await readFileAsDataURL(file);
  const t = store.threads[view.thread];
  t.replies.push({
    id: uid(), body, image,
    author: session.name, trip: session.trip,
    created: Date.now()
  });
  await saveStore(store);
  render();
}

async function sendChat() {
  const body = document.getElementById('chat-text').value.trim();
  const file = document.getElementById('chat-image').files[0];
  if (!body && !file) return;
  let image = null;
  if (file) image = await readFileAsDataURL(file);
  if (!store.chat) store.chat = [];
  store.chat.push({
    id: uid(), body, image,
    author: session.name, trip: session.trip,
    created: Date.now()
  });
  await saveStore(store);
  render();
}

document.getElementById('key-btn').onclick = async () => {
  const code = document.getElementById('key-input').value.trim();
  const err = document.getElementById('key-error');
  if (!code) { err.textContent = 'Bitte Einladungscode eingeben'; err.classList.remove('hidden'); return; }
  if (!serverMode) {
    err.textContent = 'Bitte über die Website öffnen (nicht als Datei)';
    err.classList.remove('hidden');
    return;
  }
  if (!(await validateInvite(code))) {
    err.textContent = 'Ungültige Einladung';
    err.classList.remove('hidden');
    return;
  }
  try {
    await unlock();
    err.classList.add('hidden');
  } catch {
    err.textContent = 'Daten konnten nicht geladen werden';
    err.classList.remove('hidden');
  }
};
document.getElementById('key-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('key-btn').click();
});

document.getElementById('name-btn').onclick = () => setProfile(document.getElementById('name-input').value);
document.getElementById('name-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('name-btn').click();
});

document.getElementById('go-home').onclick = () => { view = { mode: 'home', board: null, thread: null }; render(); };
document.getElementById('btn-lock').onclick = lock;
document.getElementById('btn-settings').onclick = () => { view = { mode: 'settings', board: null, thread: null }; render(); };

document.addEventListener('click', async e => {
  if (e.target.id === 'set-save') {
    settings.theme = document.getElementById('set-theme').value;
    settings.fontSize = +document.getElementById('set-font').value;
    session = parseName(document.getElementById('set-name').value);
    saveProfile(session);
    store.settings = settings;
    await saveStore(store);
    document.getElementById('display-name').textContent = session.name + session.trip;
    applySettings();
    view = { mode: 'home', board: null, thread: null };
    render();
  }
  if (e.target.id === 'set-clear') {
    if (confirm('Wirklich ALLE lokalen Daten löschen? (Server-Daten bleiben)')) {
      localStorage.removeItem('bgnk4_vault_cache');
      localStorage.removeItem('bgnk4_profile');
      lock();
    }
  }
});

applySettings();
showScreen('screen-key');
if (serverMode && inviteCode) {
  validateInvite(inviteCode).then(ok => { if (ok) unlock().catch(() => {}); });
}
</script>
</body>
</html>
